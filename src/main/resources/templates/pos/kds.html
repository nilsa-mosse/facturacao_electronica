<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KDS - Monitor de Cozinha & Produção | KwanzaERP</title>
  <meta th:name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
  <meta th:name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}"/>
  
  <!-- Fontes & Estilos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/plugins/fontawesome/css/all.min.css}">
  <link rel="stylesheet" th:href="@{/plugins/bootstrap/css/bootstrap.min.css}">
  <script th:src="@{/plugins/jquery/jquery-3.6.0.min.js}"></script>

  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: #151c2c;
      --card-header-bg: #1e293b;
      --border-color: #26334d;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --color-pending: #f43f5e;
      --color-prep: #f59e0b;
      --color-ready: #10b981;
      --color-accent: #6366f1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding-bottom: 2rem;
      overflow-x: hidden;
    }

    /* Header Glassmorphism */
    .kds-navbar {
      background: rgba(21, 28, 44, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 0.8rem 1.8rem;
      position: sticky;
      top: 0;
      z-index: 1030;
    }

    .brand-badge {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      border-radius: 12px;
      padding: 8px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
    }

    /* KPI Summary Pills */
    .kpi-pill {
      background: #1e293b;
      border: 1px solid var(--border-color);
      border-radius: 50px;
      padding: 6px 16px;
      font-weight: 600;
      font-size: 0.88rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .kpi-num {
      border-radius: 20px;
      padding: 2px 10px;
      font-weight: 800;
    }

    /* Filter Bar */
    .filter-bar {
      background: #111726;
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 1.8rem;
    }

    .btn-filter {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
      border-radius: 30px;
      padding: 8px 20px;
      font-weight: 700;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .btn-filter:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }

    .btn-filter.active {
      background: var(--color-accent);
      color: #fff;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    /* KDS Ticket Cards */
    .kds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
      padding: 1.5rem 1.8rem;
    }

    .kds-card {
      background: var(--card-bg);
      border-radius: 20px;
      border: 2px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .kds-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 35px rgba(0, 0, 0, 0.45);
    }

    /* Status Highlights */
    .kds-card.status-PENDENTE {
      border-color: var(--color-pending);
      box-shadow: 0 8px 25px rgba(244, 63, 94, 0.2);
    }

    .kds-card.status-EM_PREPARACAO {
      border-color: var(--color-prep);
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.2);
    }

    .kds-card.status-PRONTO {
      border-color: var(--color-ready);
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.2);
    }

    /* Pulse animation for delayed orders */
    .kds-card.urgent-delay {
      animation: pulseAlert 2s infinite ease-in-out;
    }

    @keyframes pulseAlert {
      0% { border-color: var(--color-pending); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.7); }
      70% { border-color: #ff0033; box-shadow: 0 0 0 14px rgba(244, 63, 94, 0); }
      100% { border-color: var(--color-pending); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
    }

    .kds-card-header {
      padding: 1.1rem 1.25rem;
      background: var(--card-header-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .order-number {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .table-badge {
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.4);
      padding: 4px 12px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .kds-card-body {
      padding: 1.25rem;
      flex-grow: 1;
    }

    .time-tracker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      margin-bottom: 1rem;
    }

    .time-tracker.normal { color: #34d399; }
    .time-tracker.warning { color: #fbbf24; background: rgba(245, 158, 11, 0.15); }
    .time-tracker.danger { color: #f87171; background: rgba(244, 63, 94, 0.2); font-weight: 800; }

    /* Item List */
    .kds-item-row {
      padding: 0.6rem 0;
      border-bottom: 1px dashed rgba(148, 163, 184, 0.15);
    }

    .kds-item-row:last-child {
      border-bottom: none;
    }

    .item-qty {
      font-size: 1.3rem;
      font-weight: 800;
      color: #f59e0b;
      min-width: 36px;
      display: inline-block;
    }

    .item-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .item-obs {
      font-size: 0.85rem;
      color: #f87171;
      font-weight: 600;
      background: rgba(244, 63, 94, 0.1);
      padding: 3px 8px;
      border-radius: 6px;
      margin-top: 4px;
      display: inline-block;
    }

    .general-obs {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.88rem;
      color: #fbbf24;
      font-weight: 600;
      margin-top: 1rem;
    }

    /* Card Action Footer */
    .kds-card-footer {
      padding: 1rem 1.25rem;
      background: rgba(0, 0, 0, 0.15);
      border-top: 1px solid var(--border-color);
    }

    .btn-action-kds {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: none;
      font-weight: 800;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .btn-action-kds:hover {
      transform: scale(1.02);
      filter: brightness(1.1);
    }

    .btn-action-kds:active {
      transform: scale(0.98);
    }

    .btn-start {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
    }

    .btn-ready {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
    }

    .btn-deliver {
      background: rgba(255, 255, 255, 0.1);
      color: #34d399;
      border: 1px solid #10b981;
    }

    .btn-deliver:hover {
      background: #10b981;
      color: #fff;
    }

    /* Empty state */
    .empty-kds {
      text-align: center;
      padding: 5rem 2rem;
      color: var(--text-muted);
    }

    .empty-kds i {
      font-size: 4rem;
      margin-bottom: 1rem;
      color: #334155;
    }

    /* Kitchen Wall TV Mode */
    body.tv-mode .kds-grid {
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 1.8rem;
    }

    body.tv-mode .item-name {
      font-size: 1.35rem;
    }

    body.tv-mode .order-number {
      font-size: 1.7rem;
    }
  </style>

  <script>
    $.ajaxSetup({
      beforeSend: function (xhr) {
        const token = $('meta[name="_csrf"]').attr('content');
        const header = $('meta[name="_csrf_header"]').attr('content');
        if (token && header && token !== '') {
          xhr.setRequestHeader(header, token);
        }
      }
    });

    let soundEnabled = true;
    let knownOrdersCount = 0;

    // Web Audio Sound Synthesizer (Zero dependências externas)
    function playOrderChime() {
      if (!soundEnabled) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15); // A5

        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.5);
      } catch (e) {
        console.log("Audio not allowed yet:", e);
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = $('#btnSoundToggle');
      if (soundEnabled) {
        btn.removeClass('btn-outline-secondary').addClass('btn-outline-warning')
           .html('<i class="fas fa-volume-up me-1"></i> Som Ativo');
        playOrderChime();
      } else {
        btn.removeClass('btn-outline-warning').addClass('btn-outline-secondary')
           .html('<i class="fas fa-volume-mute me-1"></i> Mudo');
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert("Erro ecrã inteiro: " + err.message));
        $('#btnFullscreen').html('<i class="fas fa-compress me-1"></i> Sair Ecrã Inteiro');
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        $('#btnFullscreen').html('<i class="fas fa-expand me-1"></i> Ecrã Inteiro');
      }
    }

    function toggleTvMode() {
      $('body').toggleClass('tv-mode');
      const isTv = $('body').hasClass('tv-mode');
      $('#btnTvMode').toggleClass('active', isTv);
    }

    window.mudarStatus = function(pedidoId, novoStatus) {
      const $card = $(`#kds-card-${pedidoId}`);
      $card.css('opacity', '0.5');

      $.post('/api/pos/kds/' + pedidoId + '/status?status=' + novoStatus, function() {
        carregarPedidosSilencioso();
      }).fail(function(err) {
        $card.css('opacity', '1');
        alert("Erro ao atualizar estado do pedido: " + (err.responseText || "Erro de conexão"));
      });
    };

    let currentFilter = 'TODOS';

    function filtrarPedidos(status) {
      currentFilter = status;
      $('.btn-filter').removeClass('active');
      $(`#btnFilter-${status}`).addClass('active');

      if (status === 'TODOS') {
        $('.kds-card-col').show();
      } else {
        $('.kds-card-col').hide();
        $(`.kds-card-col[data-status="${status}"]`).show();
      }
      atualizarContadores();
    }

    function atualizarContadores() {
      const total = $('.kds-card-col').length;
      const pendentes = $('.kds-card-col[data-status="PENDENTE"]').length;
      const preparacao = $('.kds-card-col[data-status="EM_PREPARACAO"]').length;
      const prontos = $('.kds-card-col[data-status="PRONTO"]').length;

      $('#countTotal').text(total);
      $('#countPendente').text(pendentes);
      $('#countPreparacao').text(preparacao);
      $('#countPronto').text(prontos);

      if (total === 0) {
        $('#kdsEmptyState').removeClass('d-none');
      } else {
        $('#kdsEmptyState').addClass('d-none');
      }
    }

    function formatarTempoDecorrido(dataHoraStr) {
      if (!dataHoraStr) return { texto: '0m', classe: 'normal', urgente: false };
      const inicio = new Date(dataHoraStr).getTime();
      const agora = new Date().getTime();
      const diffMs = Math.max(0, agora - inicio);
      
      const minutos = Math.floor(diffMs / 60000);
      const segundos = Math.floor((diffMs % 60000) / 1000);

      const text = `${minutos}m ${segundos < 10 ? '0' : ''}${segundos}s`;

      if (minutos >= 12) {
        return { texto: text, classe: 'danger', urgente: true };
      } else if (minutos >= 6) {
        return { texto: text, classe: 'warning', urgente: false };
      } else {
        return { texto: text, classe: 'normal', urgente: false };
      }
    }

    function atualizarTimersDecorridos() {
      $('.kds-card-col').each(function() {
        const dataHora = $(this).attr('data-created');
        const status = $(this).attr('data-status');
        const timerObj = formatarTempoDecorrido(dataHora);

        const $tracker = $(this).find('.time-tracker');
        $tracker.removeClass('normal warning danger').addClass(timerObj.classe);
        $tracker.find('.time-val').text(timerObj.texto);

        // Se pendente e urgente (>12 min), ativa animação pulse
        if (status === 'PENDENTE' && timerObj.urgente) {
          $(this).find('.kds-card').addClass('urgent-delay');
        } else {
          $(this).find('.kds-card').removeClass('urgent-delay');
        }
      });
    }

    function carregarPedidosSilencioso() {
      $.get('/api/pos/kds/pedidos', function(pedidos) {
        if (!Array.isArray(pedidos)) return;

        // Se houver novos pedidos do que os conhecidos, tocar o som!
        if (pedidos.length > knownOrdersCount && knownOrdersCount !== 0) {
          playOrderChime();
        }
        knownOrdersCount = pedidos.length;

        renderizarPedidosHTML(pedidos);
        atualizarContadores();
        filtrarPedidos(currentFilter);
      });
    }

    function renderizarPedidosHTML(pedidos) {
      const $container = $('#kdsOrdersContainer');
      $container.empty();

      pedidos.forEach(p => {
        const mesaNome = (p.mesa && p.mesa.numeroMesa) ? p.mesa.numeroMesa : 'Balcão / Takeaway';
        const dataHoraIso = p.dataHora || new Date().toISOString();
        const dataHoraFormat = new Date(dataHoraIso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const timerObj = formatarTempoDecorrido(dataHoraIso);

        let statusBadgeClass = 'bg-danger';
        let statusText = 'PENDENTE';
        let actionBtnHtml = '';

        if (p.status === 'PENDENTE') {
          statusBadgeClass = 'bg-danger text-white';
          statusText = '🔥 PENDENTE';
          actionBtnHtml = `
            <button class="btn-action-kds btn-start" onclick="mudarStatus(${p.id}, 'EM_PREPARACAO')">
              <i class="fas fa-fire me-1"></i> Iniciar Preparação
            </button>`;
        } else if (p.status === 'EM_PREPARACAO') {
          statusBadgeClass = 'bg-warning text-dark';
          statusText = '🍳 EM PREPARAÇÃO';
          actionBtnHtml = `
            <button class="btn-action-kds btn-ready" onclick="mudarStatus(${p.id}, 'PRONTO')">
              <i class="fas fa-check-circle me-1"></i> Marcar como Pronto
            </button>`;
        } else if (p.status === 'PRONTO') {
          statusBadgeClass = 'bg-success text-white';
          statusText = '✅ PRONTO';
          actionBtnHtml = `
            <button class="btn-action-kds btn-deliver" onclick="mudarStatus(${p.id}, 'ENTREGUE')">
              <i class="fas fa-hand-holding me-1"></i> Entregue ao Cliente
            </button>`;
        }

        let itensHtml = '';
        if (p.itens && p.itens.length > 0) {
          p.itens.forEach(it => {
            const obsHtml = (it.observacao && it.observacao.trim() !== '') 
              ? `<div class="item-obs"><i class="fas fa-exclamation-triangle me-1"></i> ${it.observacao}</div>` 
              : '';
            itensHtml += `
              <div class="kds-item-row d-flex align-items-start">
                <span class="item-qty">${it.quantidade}x</span>
                <div class="flex-grow-1">
                  <div class="item-name">${it.nomeProduto}</div>
                  ${obsHtml}
                </div>
              </div>`;
          });
        }

        const obsGeralHtml = (p.observacoes && p.observacoes.trim() !== '')
          ? `<div class="general-obs"><i class="fas fa-comment-alt me-1"></i> ${p.observacoes}</div>`
          : '';

        const cardCol = `
          <div class="col kds-card-col" id="kds-card-${p.id}" data-status="${p.status}" data-created="${dataHoraIso}">
            <div class="kds-card status-${p.status} ${p.status === 'PENDENTE' && timerObj.urgente ? 'urgent-delay' : ''}">
              <div class="kds-card-header">
                <div>
                  <div class="order-number">${p.numeroPedido || 'KDS-' + p.id}</div>
                  <div class="table-badge mt-1"><i class="fas fa-utensils me-1"></i> ${mesaNome}</div>
                </div>
                <span class="badge ${statusBadgeClass} fs-6 px-3 py-2 rounded-pill">${statusText}</span>
              </div>

              <div class="kds-card-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <div class="time-tracker ${timerObj.classe}">
                    <i class="far fa-clock"></i> <span class="time-val">${timerObj.texto}</span>
                  </div>
                  <small class="text-muted fw-bold"><i class="far fa-calendar-alt me-1"></i> ${dataHoraFormat}</small>
                </div>

                <div class="kds-items-list">
                  ${itensHtml}
                </div>

                ${obsGeralHtml}
              </div>

              <div class="kds-card-footer">
                ${actionBtnHtml}
              </div>
            </div>
          </div>`;

        $container.append(cardCol);
      });
    }

    $(document).ready(function() {
      // Carregamento inicial
      carregarPedidosSilencioso();

      // Atualizar relógio no topo
      setInterval(function() {
        const now = new Date();
        $('#liveClock').text(now.toLocaleTimeString());
      }, 1000);

      // Atualizar relógios de tempo decorrido cada segundo
      setInterval(atualizarTimersDecorridos, 1000);

      // Polling automático da API a cada 5 segundos
      setInterval(carregarPedidosSilencioso, 5000);
    });
  </script>
</head>
<body>

  <!-- Navbar Glassmorphism -->
  <header class="kds-navbar d-flex flex-wrap justify-content-between align-items-center gap-3">
    <div class="d-flex align-items-center gap-3">
      <div class="brand-badge">
        <i class="fas fa-fire-alt text-white fs-4"></i>
      </div>
      <div>
        <h4 class="m-0 fw-extrabold text-white" style="letter-spacing: -0.5px;">MONITOR DA COZINHA (KDS)</h4>
        <small class="text-muted fw-semibold" th:text="${empresa != null ? empresa.nome : 'KwanzaERP Restaurant'}">Restaurante</small>
      </div>
    </div>

    <!-- KPIs Rápidos -->
    <div class="d-none d-md-flex align-items-center gap-2">
      <div class="kpi-pill">
        <span class="text-muted">Total:</span>
        <span class="kpi-num bg-indigo-600 text-white" id="countTotal" style="background: #4f46e5;">0</span>
      </div>
      <div class="kpi-pill">
        <span class="text-danger"><i class="fas fa-fire me-1"></i> Pendentes:</span>
        <span class="kpi-num bg-danger text-white" id="countPendente">0</span>
      </div>
      <div class="kpi-pill">
        <span class="text-warning"><i class="fas fa-utensils me-1"></i> Em Prep.:</span>
        <span class="kpi-num bg-warning text-dark" id="countPreparacao">0</span>
      </div>
      <div class="kpi-pill">
        <span class="text-success"><i class="fas fa-check-circle me-1"></i> Prontos:</span>
        <span class="kpi-num bg-success text-white" id="countPronto">0</span>
      </div>
    </div>

    <!-- Ações Header -->
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-dark border border-secondary text-warning fs-6 px-3 py-2 rounded-pill font-monospace" id="liveClock">00:00:00</span>
      
      <button id="btnSoundToggle" class="btn btn-sm btn-outline-warning rounded-pill px-3 fw-bold" onclick="toggleSound()">
        <i class="fas fa-volume-up me-1"></i> Som Ativo
      </button>

      <button id="btnTvMode" class="btn btn-sm btn-outline-info rounded-pill px-3 fw-bold" onclick="toggleTvMode()" title="Aumentar texto para TV de Parede">
        <i class="fas fa-tv me-1"></i> Modo TV
      </button>

      <button id="btnFullscreen" class="btn btn-sm btn-outline-light rounded-pill px-3 fw-bold" onclick="toggleFullscreen()">
        <i class="fas fa-expand me-1"></i> Ecrã Inteiro
      </button>
    </div>
  </header>

  <!-- Filtro Dinâmico -->
  <div class="filter-bar d-flex align-items-center gap-2 overflow-auto">
    <span class="text-muted me-2 fw-bold fs-7 uppercase"><i class="fas fa-filter me-1"></i> Filtrar:</span>
    <button id="btnFilter-TODOS" class="btn-filter active" onclick="filtrarPedidos('TODOS')">
      Todos
    </button>
    <button id="btnFilter-PENDENTE" class="btn-filter" onclick="filtrarPedidos('PENDENTE')">
      🔥 Pendentes
    </button>
    <button id="btnFilter-EM_PREPARACAO" class="btn-filter" onclick="filtrarPedidos('EM_PREPARACAO')">
      🍳 Em Preparação
    </button>
    <button id="btnFilter-PRONTO" class="btn-filter" onclick="filtrarPedidos('PRONTO')">
      ✅ Prontos
    </button>
  </div>

  <!-- Grelha Principal KDS -->
  <main class="container-fluid py-3">
    
    <!-- Empty State -->
    <div id="kdsEmptyState" class="empty-kds d-none">
      <i class="fas fa-check-double text-emerald-500 mb-3" style="font-size: 5rem; color: #10b981;"></i>
      <h3 class="fw-bold text-white mb-2">Tudo em dia na Cozinha!</h3>
      <p class="text-muted fs-5">Nenhum pedido pendente ou em preparação no momento.</p>
    </div>

    <!-- Grid Container -->
    <div class="kds-grid" id="kdsOrdersContainer">
      <!-- Pedidos renderizados via AJAX com fallback Thymeleaf se offline -->
      <div class="kds-card-col" th:each="pedido : ${pedidos}" th:id="${'kds-card-' + pedido.id}" th:data-status="${pedido.status}" th:data-created="${pedido.dataHora}">
        <div class="kds-card" th:classappend="${'status-' + pedido.status}">
          <div class="kds-card-header">
            <div>
              <div class="order-number" th:text="${pedido.numeroPedido}">KDS-001</div>
              <div class="table-badge mt-1"><i class="fas fa-utensils me-1"></i> <span th:text="${pedido.mesa != null ? pedido.mesa.numeroMesa : 'Balcão / Takeaway'}">Mesa 01</span></div>
            </div>
            <span class="badge fs-6 px-3 py-2 rounded-pill" 
                  th:classappend="${pedido.status == 'PENDENTE' ? 'bg-danger text-white' : (pedido.status == 'EM_PREPARACAO' ? 'bg-warning text-dark' : 'bg-success text-white')}"
                  th:text="${pedido.status == 'PENDENTE' ? '🔥 PENDENTE' : (pedido.status == 'EM_PREPARACAO' ? '🍳 EM PREPARAÇÃO' : '✅ PRONTO')}">
              PENDENTE
            </span>
          </div>

          <div class="kds-card-body">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <div class="time-tracker normal">
                <i class="far fa-clock"></i> <span class="time-val">0m 00s</span>
              </div>
              <small class="text-muted fw-bold"><i class="far fa-calendar-alt me-1"></i> <span th:text="${#dates.format(pedido.dataHora, 'HH:mm')}">12:30</span></small>
            </div>

            <div class="kds-items-list">
              <div class="kds-item-row d-flex align-items-start" th:each="item : ${pedido.itens}">
                <span class="item-qty" th:text="${item.quantidade + 'x'}">1x</span>
                <div class="flex-grow-1">
                  <div class="item-name" th:text="${item.nomeProduto}">Hamburguer Duplo</div>
                  <div th:if="${item.observacao != null and !item.observacao.isEmpty()}" class="item-obs">
                    <i class="fas fa-exclamation-triangle me-1"></i> <span th:text="${item.observacao}">Sem cebola</span>
                  </div>
                </div>
              </div>
            </div>

            <div th:if="${pedido.observacoes != null and !pedido.observacoes.isEmpty()}" class="general-obs">
              <i class="fas fa-comment-alt me-1"></i> <span th:text="${pedido.observacoes}">Atenção ao ponto da carne</span>
            </div>
          </div>

          <div class="kds-card-footer">
            <button th:if="${pedido.status == 'PENDENTE'}" class="btn-action-kds btn-start" th:onclick="'mudarStatus(' + ${pedido.id} + ', \'EM_PREPARACAO\')'">
              <i class="fas fa-fire me-1"></i> Iniciar Preparação
            </button>
            <button th:if="${pedido.status == 'EM_PREPARACAO'}" class="btn-action-kds btn-ready" th:onclick="'mudarStatus(' + ${pedido.id} + ', \'PRONTO\')'">
              <i class="fas fa-check-circle me-1"></i> Marcar como Pronto
            </button>
            <button th:if="${pedido.status == 'PRONTO'}" class="btn-action-kds btn-deliver" th:onclick="'mudarStatus(' + ${pedido.id} + ', \'ENTREGUE\')'">
              <i class="fas fa-hand-holding me-1"></i> Entregue ao Cliente
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
